services:
  microdns-proxy:
    build: .
    image: microdns-proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:5300:5300/udp"
      - "0.0.0.0:5300:5300/tcp"
    # Uncomment to enable a blocklist; reload it with: docker compose kill -s HUP
    # volumes:
    #   - ./blocklist.txt:/blocklist.txt:ro
    # command: ["-blocklist", "/blocklist.txt"]
