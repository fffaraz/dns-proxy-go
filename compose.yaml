services:
  microdns-proxy:
    build: .
    image: microdns-proxy
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: unless-stopped
    ports:
      - "0.0.0.0:5300:5300/udp"
      - "0.0.0.0:5300:5300/tcp"
    volumes:
      - ./config.toml:/config.toml:ro
      - ./whois-cache:/whois-cache
    # Add blocklist paths to config.toml and mount the files below.
    # Reload blocklist contents with: docker compose kill -s HUP
    #   - ./blocklist.txt:/blocklist.txt:ro
